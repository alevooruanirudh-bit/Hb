<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icons/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#B23A48" />
    <meta
      name="description"
      content="HemoScan — check your hemoglobin. No needles. A screening tool, not a diagnosis."
    />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <title>HemoScan</title>
    <script>
      // Apply theme before first paint to avoid a flash.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('hemoscan-settings') || '{}');
          var mode = (s.state && s.state.theme) || 'system';
          var dark =
            mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
